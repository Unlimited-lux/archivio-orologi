# Foliant: suite di test su Windows (e su Ubuntu, per dimostrare che Linux resta verde).
name: foliant-windows

on:
  push:
    branches: ["claude/pdf-editor-updf-clone-iod4xs-windows"]
    paths: ["foliant/**", ".github/workflows/foliant-windows.yml"]
  workflow_dispatch:

concurrency:
  group: foliant-tests-${{ github.ref }}
  cancel-in-progress: false     # una suite in corso arriva sempre in fondo; resta in coda solo la più recente

jobs:
  test-windows:
    name: Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Strumenti esterni (Tesseract, Ghostscript, qpdf)
        run: |
          choco install -y --no-progress tesseract ghostscript qpdf
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($lang in "ita","eng","osd") {
            if (-not (Test-Path "$tessdata\$lang.traineddata")) {
              Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "$tessdata\$lang.traineddata"
            }
          }
          Get-ChildItem $tessdata -Filter *.traineddata | Select-Object Name
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest -p no:cacheprovider -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-windows-py${{ matrix.python }}
          path: foliant/risultati.xml

  test-ubuntu:
    name: Ubuntu (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Pacchetti di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript qpdf fonts-dejavu-core libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest -p no:cacheprovider -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
