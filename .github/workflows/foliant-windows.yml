# Foliant: suite di test su Windows (e su Ubuntu, per dimostrare che Linux resta verde).
name: foliant-windows

on:
  push:
    branches: ["claude/pdf-editor-updf-clone-iod4xs-windows"]
    paths: ["foliant/**", ".github/workflows/foliant-windows.yml"]
  workflow_dispatch:


jobs:
  test-windows:
    name: Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 150
    # una suite in corso arriva sempre in fondo; resta in coda solo la più recente (per lavoro)
    concurrency:
      group: foliant-tests-windows-${{ matrix.python }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Strumenti esterni (Tesseract, Ghostscript, qpdf)
        run: |
          choco install -y --no-progress tesseract ghostscript qpdf
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($lang in "ita","eng","osd") {
            if (-not (Test-Path "$tessdata\$lang.traineddata")) {
              Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "$tessdata\$lang.traineddata"
            }
          }
          Get-ChildItem $tessdata -Filter *.traineddata | Select-Object Name
      - name: Font dei test (DejaVu e Liberation, come in /usr/share/fonts di Ubuntu)
        run: |
          $fonts = Join-Path $env:RUNNER_TEMP "fonts"
          New-Item -ItemType Directory -Force "$fonts\truetype\dejavu", "$fonts\truetype\liberation", "$env:RUNNER_TEMP\scarico" | Out-Null
          Invoke-WebRequest "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip" -OutFile "$env:RUNNER_TEMP\scarico\dejavu.zip"
          Expand-Archive "$env:RUNNER_TEMP\scarico\dejavu.zip" "$env:RUNNER_TEMP\scarico\dejavu"
          Get-ChildItem "$env:RUNNER_TEMP\scarico\dejavu" -Recurse -Filter *.ttf | Copy-Item -Destination "$fonts\truetype\dejavu"
          Invoke-WebRequest "https://github.com/liberationfonts/liberation-fonts/releases/download/2.1.5/liberation-fonts-ttf-2.1.5.tar.gz" -OutFile "$env:RUNNER_TEMP\scarico\liberation.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\scarico\liberation.tar.gz" -C "$env:RUNNER_TEMP\scarico"
          Get-ChildItem "$env:RUNNER_TEMP\scarico" -Recurse -Filter Liberation*.ttf | Copy-Item -Destination "$fonts\truetype\liberation"
          "FOLIANT_TEST_FONTS=$fonts" >> $env:GITHUB_ENV
          Get-ChildItem "$fonts" -Recurse -Filter *.ttf | Measure-Object | ForEach-Object { "$($_.Count) font" }
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-xdist
      - name: Test
        # processi di lavoro paralleli (xdist): su Windows pytest-timeout può solo terminare il
        # processo, e così un test bloccato ferma un solo processo di lavoro e non tutta la suite
        run: python -m pytest -p no:cacheprovider -n 4 --dist loadfile -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-windows-py${{ matrix.python }}
          path: foliant/risultati.xml

  test-ubuntu:
    name: Ubuntu (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: foliant-tests-ubuntu-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Pacchetti di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript qpdf fonts-dejavu-core libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest -p no:cacheprovider -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
