# Foliant: suite di test su Windows (e su Ubuntu, per dimostrare che Linux resta verde).
name: foliant-windows

on:
  push:
    branches: ["claude/pdf-editor-updf-clone-iod4xs-windows"]
    paths: ["foliant/**", ".github/workflows/foliant-windows.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit o ramo da provare (vuoto: quello del workflow); serve a confrontare con il ramo base"
        required: false
        default: ""
      solo_ubuntu:
        description: "Solo il lavoro su Ubuntu"
        type: boolean
        default: false


jobs:
  test-windows:
    name: Windows (Python ${{ matrix.python }})
    if: ${{ !inputs.solo_ubuntu }}
    runs-on: windows-latest
    timeout-minutes: 150
    # una suite in corso arriva sempre in fondo; resta in coda solo la più recente (per lavoro)
    concurrency:
      group: foliant-tests-windows-${{ matrix.python }}-${{ github.ref }}-${{ inputs.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      FOLIANT_PERF_FACTOR: "2"     # soglie dei test di velocità: 4 processi di lavoro su 4 processori
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Strumenti esterni (Tesseract, Ghostscript, qpdf)
        run: |
          choco install -y --no-progress tesseract ghostscript qpdf
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          # stessi modelli dei pacchetti tesseract-ocr-ita/eng/osd di Ubuntu (tessdata «standard»)
          foreach ($lang in "ita","eng","osd") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/$lang.traineddata" -OutFile "$tessdata\$lang.traineddata"
          }
          Get-ChildItem $tessdata -Filter *.traineddata | Select-Object Name
      - name: Font dei test (DejaVu e Liberation, come in /usr/share/fonts di Ubuntu)
        run: |
          $fonts = Join-Path $env:RUNNER_TEMP "fonts"
          New-Item -ItemType Directory -Force "$fonts", "$env:RUNNER_TEMP\scarico" | Out-Null
          # DejaVu 2.37 come in Ubuntu (pacchetto fonts-dejavu-core: senza le varianti oblique della Sans)
          Invoke-WebRequest "http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-dejavu/fonts-dejavu-core_2.37-8_all.deb" -OutFile "$env:RUNNER_TEMP\scarico\dejavu.deb"
          # Liberation 2.1.5 come in Ubuntu (pacchetto fonts-liberation)
          Invoke-WebRequest "http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-liberation/fonts-liberation_2.1.5-3_all.deb" -OutFile "$env:RUNNER_TEMP\scarico\liberation.deb"
          python -m pip install --quiet zstandard
          python ../.github/workflows/deb_fonts.py "$env:RUNNER_TEMP\scarico\dejavu.deb" "$fonts"
          python ../.github/workflows/deb_fonts.py "$env:RUNNER_TEMP\scarico\liberation.deb" "$fonts"
          "FOLIANT_TEST_FONTS=$fonts" >> $env:GITHUB_ENV
          # gli stessi font anche per Foliant (come se fossero installati, come su Ubuntu)
          "FOLIANT_FONT_DIRS=$fonts" >> $env:GITHUB_ENV
          Get-ChildItem "$fonts" -Recurse -Filter *.ttf | Measure-Object | ForEach-Object { "$($_.Count) font" }
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-xdist
      - name: Test
        # processi di lavoro paralleli (xdist): su Windows pytest-timeout può solo terminare il
        # processo, e così un test bloccato ferma un solo processo di lavoro e non tutta la suite
        run: python -m pytest -p no:cacheprovider -n 4 --dist loadfile -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-windows-py${{ matrix.python }}
          path: foliant/risultati.xml

  test-ubuntu:
    name: Ubuntu (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: foliant-tests-ubuntu-${{ github.ref }}-${{ inputs.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: foliant
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Pacchetti di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript qpdf fonts-dejavu-core fonts-liberation libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest -p no:cacheprovider -rfEs --durations=25 --junitxml=risultati.xml
      - name: Riepilogo
        if: always()
        run: python ../.github/workflows/junit_summary.py risultati.xml
