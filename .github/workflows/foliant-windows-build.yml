# Foliant: pacchetto per Windows (PyInstaller + Inno Setup) e versione portatile, come artefatti
# (conservati 30 giorni); poi la prova dell'installatore su una macchina Windows pulita.
name: foliant-windows-build

on:
  push:
    branches:
      - "claude/pdf-editor-updf-clone-iod4xs"
      - "claude/pdf-editor-updf-clone-iod4xs-windows"
      - "claude/pdf-editor-updf-clone-iod4xs-windows-installer"
    paths: ["foliant/**", ".github/workflows/foliant-windows-build.yml"]
  workflow_dispatch:

concurrency:
  group: foliant-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Installatore Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: foliant
    env:
      PYTHONUTF8: "1"
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foliant/requirements.txt
      - name: Strumenti esterni e Inno Setup
        run: |
          # Chocolatey scarica dai siti dei progetti: fino a tre tentativi
          function Installa-Pacchetti([string[]]$pacchetti) {
            for ($i = 1; $i -le 3; $i++) {
              choco install -y --no-progress @pacchetti
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds (20 * $i)
            }
            throw "choco install non riuscito: $pacchetti"
          }
          Installa-Pacchetti tesseract, ghostscript, qpdf
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { Installa-Pacchetti innosetup }
      - name: Dipendenze Python e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Versione
        id: ver
        run: |
          $v = python -c "import foliant; print(foliant.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Icona
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python packaging/windows/make_icon.py build/foliant.ico
      - name: Tesseract (ita, eng, osd), Ghostscript, qpdf e licenze
        run: ./packaging/windows/collect_tools.ps1 -Destinazione build/tools -Licenze build/licenze
      - name: PyInstaller
        run: |
          pyinstaller packaging/windows/foliant.spec --noconfirm --distpath dist --workpath build/pyinstaller
          Copy-Item build/tools dist/Foliant/tools -Recurse
          Copy-Item build/licenze dist/Foliant/licenze -Recurse
          Copy-Item packaging/windows/LEGGIMI.txt dist/Foliant/LEGGIMI.txt
      - name: Prova del pacchetto
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $cli = "dist/Foliant/foliant-cli.exe"
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "foliant-cli --version non riuscito" }
          & $cli -I -c "exec(open('packaging/windows/check_bundle.py', encoding='utf-8').read())"
          if ($LASTEXITCODE -ne 0) { throw "prova del pacchetto non riuscita" }
      - name: Installatore (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\foliant.iss `
            "/DAppVersion=${{ steps.ver.outputs.version }}" /DSourceDir=..\..\dist\Foliant /DOutputDir=..\..\out /DIconFile=..\..\build\foliant.ico
          if ($LASTEXITCODE -ne 0) { throw "ISCC non riuscito" }
          Get-ChildItem out
      - name: Versione portatile (.zip)
        run: |
          $name = "Foliant-portable-${{ steps.ver.outputs.version }}"
          Copy-Item dist/Foliant "out/$name" -Recurse
          Copy-Item packaging/windows/portatile.txt "out/$name/portatile.txt"
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
          Remove-Item "out/$name" -Recurse
          Get-ChildItem out | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: Foliant-Setup-${{ steps.ver.outputs.version }}
          path: foliant/out/Foliant-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Foliant-portable-${{ steps.ver.outputs.version }}
          path: foliant/out/Foliant-portable-*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  test-installer:
    name: Prova dell'installatore
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: foliant
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: foliant/packaging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti della prova (PDF di prova e ricerca delle tracce)
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: Foliant-*-${{ needs.build.outputs.version }}
          path: foliant/artefatti
          merge-multiple: true
      - name: Installazione, uso senza schermo, riservatezza, disinstallazione
        run: |
          ./packaging/windows/prova/prova_installatore.ps1 `
            -Setup "artefatti/Foliant-Setup-${{ needs.build.outputs.version }}.exe" `
            -Versione "${{ needs.build.outputs.version }}" -Lavoro "$env:RUNNER_TEMP\prova"
      - name: Versione portatile
        run: |
          $dir = Join-Path $env:RUNNER_TEMP portatile
          Expand-Archive "artefatti/Foliant-portable-${{ needs.build.outputs.version }}.zip" $dir
          $cli = Get-ChildItem $dir -Recurse -Filter foliant-cli.exe | Select-Object -First 1
          & $cli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "foliant-cli --version non riuscito nella versione portatile" }
          if (-not (Test-Path (Join-Path $cli.DirectoryName portatile.txt))) { throw "portatile.txt mancante" }
